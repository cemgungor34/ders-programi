<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e1b4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Bilişim Ders Programı</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --primary: #4f46e5;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text-main);
    padding: 12px 12px 32px;
    min-height: 100vh;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* CANLI DURUM KARTI */
  .live-banner {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 60%, #4338ca 100%);
    color: #fff;
    border-radius: 20px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 10px 24px -6px rgba(49, 46, 129, 0.35);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
  }

  .live-banner.state-active {
    background: linear-gradient(135deg, #064e3b 0%, #047857 60%, #10b981 100%);
    box-shadow: 0 10px 24px -6px rgba(4, 120, 87, 0.35);
  }

  .live-banner.state-break {
    background: linear-gradient(135deg, #7c2d12 0%, #c2410c 60%, #ea580c 100%);
    box-shadow: 0 10px 24px -6px rgba(194, 65, 12, 0.35);
  }

  .live-banner.state-free {
    background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    box-shadow: 0 10px 24px -6px rgba(15, 23, 42, 0.25);
  }

  .live-left {
    flex: 1 1 260px;
  }

  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255, 255, 255, 0.18);
    padding: 4px 11px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 7px rgba(74, 222, 128, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
  }

  .live-main-text {
    font-size: 1.65rem;
    font-weight: 800;
    line-height: 1.2;
  }

  .live-sub-text {
    font-size: 0.92rem;
    color: rgba(255, 255, 255, 0.92);
    margin-top: 6px;
    font-weight: 500;
  }

  .live-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .clock-box {
    background: rgba(0, 0, 0, 0.24);
    border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 8px 14px;
    border-radius: 12px;
    text-align: right;
  }

  .live-clock {
    font-size: 1.4rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .live-date {
    font-size: 0.76rem;
    color: rgba(255, 255, 255, 0.85);
  }

  .btn-bell-settings {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.35);
    color: #fff;
    padding: 7px 12px;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* ZİL SAATLERİ AYAR PANELİ */
  .bell-panel {
    display: none;
    background: var(--card-bg);
    border: 2px solid #cbd5e1;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  }

  .bell-panel.open { display: block; }

  .bell-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    margin: 12px 0;
  }

  .bell-item {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
  }

  .bell-item label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    color: #475569;
    margin-bottom: 4px;
  }

  .bell-inputs {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .bell-inputs input[type="time"] {
    width: 100%;
    padding: 5px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--card-bg);
    padding: 10px 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 14px;
  }

  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  button.btn {
    border: 1px solid var(--border);
    background: #f8fafc;
    color: var(--text-main);
    padding: 7px 12px;
    border-radius: 9px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  button.btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  button.btn-save { background: #16a34a; color: #fff; border-color: #16a34a; }
  button.btn-reset { color: #dc2626; border-color: #fecaca; background: #fef2f2; }

  .table-wrapper {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 780px;
  }

  th {
    background: #f8fafc;
    color: #334155;
    font-weight: 700;
    font-size: 0.86rem;
    padding: 10px 6px;
    border-bottom: 2px solid var(--border);
    border-right: 1px solid var(--border);
    text-align: center;
  }

  th small {
    display: block;
    font-size: 0.7rem;
    font-weight: 600;
    color: #64748b;
  }

  th:first-child { width: 115px; background: #f1f5f9; }
  th:last-child, td:last-child { border-right: none; }
  tr { border-bottom: 1px solid var(--border); }
  tr:last-child { border-bottom: none; }

  td.day-cell {
    font-weight: 700;
    font-size: 0.92rem;
    background: #f8fafc;
    padding: 12px 10px;
    border-right: 2px solid var(--border);
  }

  td.day-cell.today {
    background: #eef2ff;
    color: #4338ca;
    border-left: 5px solid #4f46e5;
  }

  .today-tag {
    display: inline-block;
    font-size: 0.65rem;
    background: #4f46e5;
    color: #fff;
    padding: 2px 5px;
    border-radius: 4px;
    margin-top: 3px;
  }

  td.slot {
    padding: 6px;
    border-right: 1px solid var(--border);
    height: 80px;
    width: calc((100% - 115px) / 7);
  }

  .empty-slot {
    height: 100%;
    border-radius: 9px;
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #94a3b8;
    font-size: 0.74rem;
  }

  .lesson-card {
    height: 100%;
    border-radius: 10px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    position: relative;
    user-select: none;
    border-left: 5px solid transparent;
  }

  .lesson-card.now-active {
    outline: 3px solid #10b981;
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.25);
    z-index: 3;
  }

  .lesson-card.now-next {
    outline: 3px dashed #f97316;
    z-index: 2;
  }

  .status-badge {
    position: absolute;
    top: -7px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.62rem;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 999px;
    color: #fff;
    white-space: nowrap;
  }

  .badge-now { background: #059669; }
  .badge-next { background: #ea580c; }
  .lesson-card.dimmed { opacity: 0.22; }
  .lesson-card.done { opacity: 0.55; text-decoration: line-through; }

  .lesson-card.done::after {
    content: "✓";
    position: absolute;
    top: 3px;
    right: 5px;
    background: #16a34a;
    color: #fff;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    font-size: 0.68rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .class-name { font-size: 1.02rem; font-weight: 800; }
  .subject-name { font-size: 0.7rem; font-weight: 700; margin-top: 2px; opacity: 0.85; }

  /* 5. Sınıflar */
  .c-5A { background: #fff1f2; color: #9f1239; border-left-color: #f43f5e; }
  .c-5B { background: #fff7ed; color: #9a3412; border-left-color: #f97316; }
  .c-5C { background: #fefce8; color: #854d0e; border-left-color: #eab308; }
  .c-5D { background: #fdf4ff; color: #86198f; border-left-color: #d946ef; }
  .c-5E { background: #fef2f2; color: #991b1b; border-left-color: #ef4444; }

  /* 6. Sınıflar */
  .c-6A { background: #eff6ff; color: #1e40af; border-left-color: #3b82f6; }
  .c-6B { background: #ecfdf5; color: #065f46; border-left-color: #10b981; }
  .c-6C { background: #f0fdfa; color: #115e59; border-left-color: #14b8a6; }
  .c-6D { background: #eef2ff; color: #3730a3; border-left-color: #6366f1; }
  .c-6E { background: #f5f3ff; color: #5b21b6; border-left-color: #8b5cf6; }

  @media (max-width: 640px) {
    .live-main-text { font-size: 1.45rem; }
    .live-right { width: 100%; flex-direction: row; justify-content: space-between; align-items: center; }
    .clock-box { text-align: left; }
  }
</style>
</head>
<body>

<div class="container">
  <div id="live-banner" class="live-banner">
    <div class="live-left">
      <div class="live-pill">
        <span class="pulse-dot"></span>
        <span id="live-status-label">KONTROL EDİLİYOR...</span>
      </div>
      <div class="live-main-text" id="live-main-text">Yükleniyor...</div>
      <div class="live-sub-text" id="live-sub-text"></div>
    </div>
    <div class="live-right">
      <div class="clock-box">
        <div class="live-clock" id="live-clock">--:--:--</div>
        <div class="live-date" id="live-date">---</div>
      </div>
      <button class="btn-bell-settings" onclick="toggleBellPanel()">⏰ Zil Saatleri</button>
    </div>
  </div>

  <div id="bell-panel" class="bell-panel">
    <h3 style="font-size:1rem;">⏰ Okul Zil Saatleri</h3>
    <div class="bell-grid" id="bell-grid"></div>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn btn-reset" onclick="resetBellTimes()">Varsayılan</button>
      <button class="btn btn-save" onclick="saveBellTimes()">💾 Kaydet</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="filters">
      <button class="btn active" onclick="filterGrade('all', this)">Tümü</button>
      <button class="btn" onclick="filterGrade('5', this)">5. Sınıflar</button>
      <button class="btn" onclick="filterGrade('6', this)">6. Sınıflar</button>
    </div>
    <button class="btn btn-reset" onclick="resetDone()">✓ İşaretleri Sıfırla</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead id="table-head"></thead>
      <tbody id="schedule-body"></tbody>
    </table>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  const scheduleData = [
    { day: "Pazartesi", dayIndex: 1, slots: ["6/B", "6/B", null, "6/E", "6/E", "5/E", "5/E"] },
    { day: "Salı",      dayIndex: 2, slots: ["6/A", "6/A", null, "5/D", "5/D", "6/C", "6/C"] },
    { day: "Çarşamba",  dayIndex: 3, slots: [null, null, null, null, null, null, null] },
    { day: "Perşembe",  dayIndex: 4, slots: ["5/C", "5/C", null, null, null, "5/A", "5/A"] },
    { day: "Cuma",      dayIndex: 5, slots: ["6/D", "6/D", null, null, null, "5/B", "5/B"] }
  ];

  const defaultBellTimes = [
    { start: "08:30", end: "09:10" },
    { start: "09:20", end: "10:00" },
    { start: "10:15", end: "10:55" },
    { start: "11:05", end: "11:45" },
    { start: "11:55", end: "12:35" },
    { start: "13:30", end: "14:10" },
    { start: "14:20", end: "15:00" }
  ];

  const STORAGE_DONE = "bilisim_ders_programi_done_v3";
  const STORAGE_BELLS = "bilisim_zil_saatleri_v3";

  let doneSlots = JSON.parse(localStorage.getItem(STORAGE_DONE) || "{}");
  let bellTimes = JSON.parse(localStorage.getItem(STORAGE_BELLS) || "null") || JSON.parse(JSON.stringify(defaultBellTimes));
  let lastRenderedStateKey = "";

  function timeToMinutes(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    return h * 60 + m;
  }

  function formatRemaining(mins) {
    if (mins <= 0) return "1 dakikadan az";
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h} saat ${m} dk` : `${m} dakika`;
  }

  function renderBellSettings() {
    const grid = document.getElementById("bell-grid");
    grid.innerHTML = "";
    bellTimes.forEach((b, i) => {
      const div = document.createElement("div");
      div.className = "bell-item";
      div.innerHTML = `
        <label>${i + 1}. Ders</label>
        <div class="bell-inputs">
          <input type="time" id="bell-start-${i}" value="${b.start}">
          <span>-</span>
          <input type="time" id="bell-end-${i}" value="${b.end}">
        </div>
      `;
      grid.appendChild(div);
    });
  }

  function toggleBellPanel() {
    const panel = document.getElementById("bell-panel");
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) renderBellSettings();
  }

  function saveBellTimes() {
    const updated = [];
    for (let i = 0; i < 7; i++) {
      const s = document.getElementById(`bell-start-${i}`).value;
      const e = document.getElementById(`bell-end-${i}`).value;
      if (s && e) updated.push({ start: s, end: e });
    }
    if (updated.length === 7) {
      bellTimes = updated;
      localStorage.setItem(STORAGE_BELLS, JSON.stringify(bellTimes));
      lastRenderedStateKey = "";
      updateLiveStatus();
      document.getElementById("bell-panel").classList.remove("open");
    }
  }

  function resetBellTimes() {
    bellTimes = JSON.parse(JSON.stringify(defaultBellTimes));
    localStorage.removeItem(STORAGE_BELLS);
    renderBellSettings();
    lastRenderedStateKey = "";
    updateLiveStatus();
  }

  function evaluateCurrentState(now) {
    const jsDay = now.getDay();
    const nowMins = now.getHours() * 60 + now.getMinutes();
    const todayRow = scheduleData.find(d => d.dayIndex === jsDay);

    if (!todayRow) {
      return {
        bannerClass: "state-free",
        pill: "HAFTA SONU",
        main: "Bugün Ders Yok 🎉",
        sub: "Pazartesi 1. ders (08:30): 6/B Bilişim",
        activeSlotIndex: -1,
        nextSlotIndex: -1,
        todayIndex: jsDay
      };
    }

    if (!todayRow.slots.some(s => s !== null)) {
      return {
        bannerClass: "state-free",
        pill: `${todayRow.day.toUpperCase()} • BOŞ GÜN`,
        main: "Bugün Hiç Dersiniz Yok ☕",
        sub: "Çarşamba günü programınız tamamen boş.",
        activeSlotIndex: -1,
        nextSlotIndex: -1,
        todayIndex: jsDay
      };
    }

    for (let i = 0; i < 7; i++) {
      const startM = timeToMinutes(bellTimes[i].start);
      const endM = timeToMinutes(bellTimes[i].end);
      if (nowMins >= startM && nowMins < endM) {
        const cls = todayRow.slots[i];
        const rem = endM - nowMins;
        let nextInfo = "Bugün başka dersiniz kalmadı.";
        let nextIdx = -1;
        for (let j = i + 1; j < 7; j++) {
          if (todayRow.slots[j]) {
            nextInfo = `Sonraki: ${j + 1}. Ders (${bellTimes[j].start}) → ${todayRow.slots[j]}`;
            nextIdx = j;
            break;
          }
        }
        if (cls) {
          return {
            bannerClass: "state-active",
            pill: `ŞU AN ${i + 1}. DERS (${bellTimes[i].start} - ${bellTimes[i].end})`,
            main: `👉 ${cls} — BİLİŞİM`,
            sub: `Zile ${formatRemaining(rem)} kaldı • ${nextInfo}`,
            activeSlotIndex: i,
            nextSlotIndex: nextIdx,
            todayIndex: jsDay
          };
        } else {
          return {
            bannerClass: "state-free",
            pill: `ŞU AN ${i + 1}. DERS SAATİ`,
            main: "Bu Ders Saati Boş ☕",
            sub: `Bitime ${formatRemaining(rem)} var • ${nextInfo}`,
            activeSlotIndex: i,
            nextSlotIndex: nextIdx,
            todayIndex: jsDay
          };
        }
      }
    }

    for (let i = 0; i < 7; i++) {
      const startM = timeToMinutes(bellTimes[i].start);
      if (nowMins < startM) {
        const waitMins = startM - nowMins;
        const cls = todayRow.slots[i];
        let nextFilledIdx = -1;
        for (let j = i; j < 7; j++) {
          if (todayRow.slots[j]) { nextFilledIdx = j; break; }
        }
        if (cls) {
          return {
            bannerClass: "state-break",
            pill: i === 0 ? "GÜN BAŞLIYOR" : "TENEFFÜS / ARA",
            main: `Sıradaki Sınıf: ${cls} (${i + 1}. Ders)`,
            sub: `${bellTimes[i].start} ziline ${formatRemaining(waitMins)} kaldı`,
            activeSlotIndex: -1,
            nextSlotIndex: i,
            todayIndex: jsDay
          };
        } else if (nextFilledIdx !== -1) {
          const nextCls = todayRow.slots[nextFilledIdx];
          const nextStart = bellTimes[nextFilledIdx].start;
          const totalWait = timeToMinutes(nextStart) - nowMins;
          return {
            bannerClass: "state-break",
            pill: `${i + 1}. DERSİNİZ BOŞ`,
            main: `Sıradaki Dolu Ders: ${nextCls} (${nextFilledIdx + 1}. Ders)`,
            sub: `Saat ${nextStart}'da başlayacak (${formatRemaining(totalWait)} sonra)`,
            activeSlotIndex: -1,
            nextSlotIndex: nextFilledIdx,
            todayIndex: jsDay
          };
        }
      }
    }

    return {
      bannerClass: "state-free",
      pill: "DERSLER TAMAMLANDI",
      main: "Bugünkü Tüm Dersler Bitti 🎉",
      sub: "İyi dinlenmeler!",
      activeSlotIndex: -1,
      nextSlotIndex: -1,
      todayIndex: jsDay
    };
  }

  function renderTable(state) {
    document.getElementById("table-head").innerHTML = `
      <tr>
        <th>Günler</th>
        ${bellTimes.map((b, idx) => `<th>${idx + 1}. Ders<small>${b.start}–${b.end}</small></th>`).join("")}
      </tr>
    `;

    const tbody = document.getElementById("schedule-body");
    tbody.innerHTML = "";

    scheduleData.forEach((row) => {
      const tr = document.createElement("tr");
      const isToday = row.dayIndex === state.todayIndex;

      const dayTd = document.createElement("td");
      dayTd.className = "day-cell" + (isToday ? " today" : "");
      dayTd.innerHTML = row.day + (isToday ? '<br><span class="today-tag">BUGÜN</span>' : "");
      tr.appendChild(dayTd);

      row.slots.forEach((cls, idx) => {
        const td = document.createElement("td");
        td.className = "slot";
        if (!cls) {
          td.innerHTML = '<div class="empty-slot">Boş</div>';
        } else {
          const slotId = `${row.day}-${idx + 1}`;
          const grade = cls.split("/")[0];
          const cleanClass = cls.replace("/", "");
          const isDone = !!doneSlots[slotId];
          const isNow = isToday && state.activeSlotIndex === idx;
          const isNext = isToday && state.nextSlotIndex === idx && !isNow;

          const card = document.createElement("div");
          card.className = `lesson-card c-${cleanClass}` + (isDone ? " done" : "") + (isNow ? " now-active" : "") + (isNext ? " now-next" : "");
          card.dataset.grade = grade;

          let badgeHtml = "";
          if (isNow) badgeHtml = '<span class="status-badge badge-now">ŞU AN</span>';
          else if (isNext) badgeHtml = '<span class="status-badge badge-next">SIRADAKİ</span>';

          card.innerHTML = `${badgeHtml}<span class="class-name">${cls}</span><span class="subject-name">BİLİŞİM</span>`;
          card.addEventListener("click", () => {
            if (doneSlots[slotId]) { delete doneSlots[slotId]; card.classList.remove("done"); }
            else { doneSlots[slotId] = true; card.classList.add("done"); }
            localStorage.setItem(STORAGE_DONE, JSON.stringify(doneSlots));
          });
          td.appendChild(card);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  function updateLiveStatus() {
    const now = new Date();
    const daysTr = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
    const monthsTr = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

    document.getElementById("live-clock").textContent = now.toTimeString().slice(0, 8);
    document.getElementById("live-date").textContent = `${now.getDate()} ${monthsTr[now.getMonth()]} • ${daysTr[now.getDay()]}`;

    const state = evaluateCurrentState(now);
    document.getElementById("live-banner").className = `live-banner ${state.bannerClass}`;
    document.getElementById("live-status-label").textContent = state.pill;
    document.getElementById("live-main-text").textContent = state.main;
    document.getElementById("live-sub-text").textContent = state.sub;

    const stateKey = `${state.todayIndex}-${state.activeSlotIndex}-${state.nextSlotIndex}-${JSON.stringify(bellTimes)}`;
    if (stateKey !== lastRenderedStateKey) {
      lastRenderedStateKey = stateKey;
      renderTable(state);
    }
  }

  function resetDone() {
    doneSlots = {};
    localStorage.removeItem(STORAGE_DONE);
    document.querySelectorAll(".lesson-card.done").forEach(el => el.classList.remove("done"));
  }

  function filterGrade(grade, btnEl) {
    document.querySelectorAll(".filters .btn").forEach(b => b.classList.remove("active"));
    btnEl.classList.add("active");
    document.querySelectorAll(".lesson-card").forEach(card => {
      card.classList.toggle("dimmed", grade !== "all" && card.dataset.grade !== grade);
    });
  }

  updateLiveStatus();
  setInterval(updateLiveStatus, 1000);
</script>
</body>
</html>
